# MySQL 配置
# 密码从环境变量 MYSQL_PASSWORD 读取（见 .env），此处不存明文
[mysql]
host = 127.0.0.1
port = 3307
user = root
password = 12345678
database = legal_qa

# Redis 配置
# 密码从环境变量 REDIS_PASSWORD 读取（见 .env），此处不存明文
[redis]
host = localhost
port = 6380
password =
db = 0

# Milvus 配置
[milvus]
host = localhost
port = 19530
database_name = default
collection_name = legal_rag

# LLM 配置（API 密钥从 .env 环境变量读取，不在此明文存放）
[llm]
model = qwen3-max
# dashscope_api_key 与 dashscope_base_url 由 base/config.py 从 .env 加载
dashscope_api_key =
dashscope_base_url =

# 模型目录配置（embedding/reranker/文档分割等本地模型所在根目录）
# 本项目 rag_qa/models 为指向原 Itcast_qa_system\rag_qa\models 的符号链接（junction），
# 故此处指向本项目路径即可，项目自包含。
[model]
models_dir = E:\陈杰\Legal_qa_system\rag_qa\models

# 检索参数配置
[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 5
candidate_m = 5
# 子查询检索最多拆分的子问题数量（控制每查询的 LLM+向量检索开销）
max_subqueries = 3

# 日志配置
[logger]
log_file = logs/app.log

# 应用配置
[app]
valid_sources = ["民法典", "劳动法", "劳动合同法", "公司法", "刑法", "民事诉讼法"]
customer_service_phone = 本系统仅提供法律信息参考，不构成法律意见，请咨询执业律师
# 会话历史保留轮数（对话上下文喂给 LLM 的最近 N 轮）
history_limit = 5