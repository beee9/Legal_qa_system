# MySQL 配置
[mysql]
host = localhost
user = root
password = 12345678
database = legal_qa

# Redis 配置
[redis]
host = localhost
port = 6379
password = 1234
db = 0

# Milvus 配置
[milvus]
host = localhost
port = 19530
database_name = itcast
collection_name = legal_rag

# LLM 配置（API 密钥从 .env 环境变量读取，不在此明文存放）
[llm]
model = qwen3-max
# dashscope_api_key 与 dashscope_base_url 由 base/config.py 从 .env 加载
dashscope_api_key =
dashscope_base_url =

# 检索参数配置
[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 5
candidate_m = 5

# 日志配置
[logger]
log_file = E:\陈杰\Legal_qa_system\logs\app.log

# 应用配置
[app]
valid_sources = ["民法典", "劳动法", "劳动合同法", "公司法", "刑法", "民事诉讼法"]
customer_service_phone = 本系统仅提供法律信息参考，不构成法律意见，请咨询执业律师