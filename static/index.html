<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>法律智能问答助手</title>
    <!-- Font Awesome 图标库 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- marked.js 渲染 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 清爽年轻化字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ============ 设计 token：清爽年轻化 ============ */
        :root {
            --bg: #F6F8FA;
            --bg-sidebar: #FFFFFF;
            --surface: #FFFFFF;
            --surface-soft: #F0F5F7;
            --primary: #2DD4BF;          /* 清爽 teal */
            --primary-hover: #14B8A6;
            --primary-soft: rgba(45, 212, 191, 0.12);
            --accent: #0EA5E9;           /* sky 辅助 */
            --text: #111827;
            --text-2: #4B5563;
            --text-muted: #9CA3AF;
            --border: #E5E7EB;
            --danger: #EF4444;
            --radius-lg: 20px;
            --radius-md: 14px;
            --shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
            --shadow-lg: 0 18px 50px rgba(15, 23, 42, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::selection { background: var(--primary); color: #fff; }
        html, body { height: 100%; }
        body {
            font-family: 'Noto Sans SC', -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ============ 载入动画 ============ */
        @keyframes rise { 0%{opacity:0;transform:translateY(18px);} 100%{opacity:1;transform:translateY(0);} }
        @keyframes pop { 0%{opacity:0;transform:translateY(8px) scale(.98);} 100%{opacity:1;transform:none;} }
        @keyframes caret { 0%,100%{opacity:1;} 50%{opacity:0;} }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes floatDot { 0%,100%{transform:translateY(0);opacity:.4;} 50%{transform:translateY(-4px);opacity:1;} }

        .anim-rise { animation: rise .6s cubic-bezier(.16,1,.3,1) both; }
        .anim-pop { animation: pop .35s cubic-bezier(.16,1,.3,1) both; }
        @media (prefers-reduced-motion: reduce) {
            .anim-rise, .anim-pop { animation: none; }
            .typing-caret, .typing-dots span { animation: none !important; }
        }

        /* ============ 布局骨架 ============ */
        .app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

        /* 侧边栏 */
        .sidebar {
            width: 280px; min-width: 280px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            transition: transform .3s cubic-bezier(.16,1,.3,1);
        }
        .sidebar-head { padding: 20px 18px; border-bottom: 1px solid var(--border); }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-logo {
            width: 42px; height: 42px; border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: grid; place-items: center; color: #fff; font-size: 18px;
            box-shadow: 0 6px 16px rgba(45,212,191,.35);
        }
        .brand h1 { font-size: 16px; font-weight: 700; letter-spacing: .01em; line-height: 1.2; }
        .brand p { font-size: 11px; color: var(--text-muted); font-weight: 400; }

        .new-session-btn {
            margin: 16px 18px 6px; padding: 11px 14px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff; border: none; border-radius: var(--radius-md);
            font-size: 13px; font-weight: 600; cursor: pointer;
            transition: transform .2s, box-shadow .2s;
            box-shadow: 0 8px 18px rgba(45,212,191,.35);
        }
        .new-session-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(45,212,191,.42); }
        .new-session-btn:active { transform: scale(.97); }

        .session-label {
            padding: 14px 20px 6px; font-size: 11px; font-weight: 600;
            color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em;
        }
        .session-list { flex: 1; overflow-y: auto; padding: 0 10px 12px; }
        .session-list::-webkit-scrollbar { width: 5px; }
        .session-list::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 4px; }
        .session-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 10px; cursor: pointer;
            transition: background .2s; position: relative;
        }
        .session-item:hover { background: var(--surface-soft); }
        .session-item.active { background: var(--primary-soft); }
        .session-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
        .session-item .txt { flex: 1; overflow: hidden; }
        .session-item .txt .q { font-size: 12.5px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .session-item .txt .meta { font-size: 10.5px; color: var(--text-muted); }
        .session-item .del {
            width: 24px; height: 24px; border-radius: 6px; border: none;
            background: transparent; color: var(--text-muted); cursor: pointer;
            display: none; place-items: center; font-size: 12px;
        }
        .session-item:hover .del { display: grid; }
        .session-item .del:hover { background: rgba(239,68,68,.1); color: var(--danger); }

        .sidebar-foot { padding: 14px 18px; border-top: 1px solid var(--border); font-size: 10.5px; color: var(--text-muted); line-height: 1.5; }

        /* 主区域 */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
        .topbar {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 20px; background: rgba(255,255,255,.8);
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
            z-index: 5;
        }
        .menu-btn { display: none; width: 40px; height: 40px; border: 1px solid var(--border); background: #fff; border-radius: 10px; color: var(--text); cursor: pointer; font-size: 15px; }
        .topbar-status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22C55E; box-shadow: 0 0 0 3px rgba(34,197,94,.18); }
        .disclaimer {
            margin-left: auto; display: flex; align-items: center; gap: 7px;
            font-size: 11px; color: var(--text-muted); background: var(--surface-soft);
            padding: 6px 12px; border-radius: 999px;
        }
        .disclaimer i { color: var(--accent); }

        .chat-wrap { flex: 1; overflow-y: auto; padding: 24px 20px 8px; scroll-behavior: smooth; }
        .chat-wrap::-webkit-scrollbar { width: 6px; }
        .chat-wrap::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 4px; }

        .chat-inner { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

        /* 消息 */
        .msg { display: flex; gap: 12px; max-width: 88%; }
        .msg.assistant { align-self: flex-start; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }

        .avatar {
            width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
            display: grid; place-items: center; font-size: 14px; color: #fff;
        }
        .msg.assistant .avatar { background: linear-gradient(135deg, var(--primary), var(--accent)); }
        .msg.user .avatar { background: #1E293B; }

        .bubble { padding: 12px 16px; border-radius: var(--radius-md); font-size: 14px; line-height: 1.75; }
        .msg.assistant .bubble {
            background: var(--surface); border: 1px solid var(--border);
            border-top-left-radius: 4px; box-shadow: var(--shadow);
        }
        .msg.user .bubble {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff; border-top-right-radius: 4px;
            box-shadow: 0 8px 20px rgba(45,212,191,.3);
        }
        .msg .bubble p { margin: 6px 0; }
        .msg .bubble p:first-child { margin-top: 0; }
        .msg .bubble p:last-child { margin-bottom: 0; }
        .msg .bubble ul, .msg .bubble ol { margin: 6px 0 6px 20px; }
        .msg .bubble li { margin: 3px 0; }
        .msg .bubble pre {
            background: #0B1220; color: #E2E8F0; padding: 12px 14px; border-radius: 10px;
            overflow-x: auto; font-size: 12.5px; margin: 8px 0; line-height: 1.6;
        }
        .msg .bubble code { font-family: 'SFMono-Regular', Consolas, monospace; }
        .msg .bubble :not(pre) > code {
            background: var(--surface-soft); color: var(--accent); padding: 2px 6px; border-radius: 6px; font-size: 12.5px;
        }
        .msg .bubble blockquote { border-left: 3px solid var(--primary); padding-left: 12px; color: var(--text-2); margin: 8px 0; }

        /* 法条高亮 */
        .law-ref {
            color: var(--accent); font-weight: 600; cursor: pointer;
            border-bottom: 1px dashed rgba(14,165,233,.5); padding-bottom: 1px;
            transition: background .2s;
        }
        .law-ref:hover { background: rgba(14,165,233,.1); }

        .msg-meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 11px; color: var(--text-muted); }
        .src-badge {
            display: inline-flex; align-items: center; gap: 5px;
            background: var(--surface-soft); border: 1px solid var(--border);
            padding: 3px 9px; border-radius: 999px; font-size: 10.5px;
        }
        .src-badge i { color: var(--accent); font-size: 9px; }

        /* 打字机 */
        .typing-caret {
            display: inline-block; width: 8px; height: 16px; margin-left: 2px;
            background: var(--primary); border-radius: 2px; vertical-align: -2px;
            animation: caret .8s infinite;
        }
        .typing-dots { display: flex; gap: 5px; padding: 6px 2px; }
        .typing-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); animation: floatDot 1.1s infinite; }
        .typing-dots span:nth-child(2){ animation-delay: .15s; }
        .typing-dots span:nth-child(3){ animation-delay: .3s; }

        /* 欢迎卡片 */
        .welcome { text-align: center; padding: 34px 20px 10px; }
        .welcome .big {
            width: 62px; height: 62px; margin: 0 auto 16px; border-radius: 18px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: grid; place-items: center; color: #fff; font-size: 26px;
            box-shadow: 0 12px 30px rgba(45,212,191,.4);
        }
        .welcome h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .welcome p { font-size: 13.5px; color: var(--text-2); max-width: 460px; margin: 0 auto; }
        .suggest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
        .suggest button {
            padding: 8px 14px; border: 1px solid var(--border); background: #fff;
            border-radius: 999px; font-size: 12px; color: var(--text-2); cursor: pointer;
            transition: all .2s;
        }
        .suggest button:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); transform: translateY(-1px); }

        /* 输入区 */
        .composer { padding: 12px 20px 20px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
        .composer-inner {
            max-width: 780px; margin: 0 auto; background: var(--surface);
            border: 1px solid var(--border); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg); padding: 8px 10px 8px 16px;
            display: flex; align-items: flex-end; gap: 8px;
            transition: border-color .2s, box-shadow .2s;
        }
        .composer-inner:focus-within { border-color: var(--primary); box-shadow: 0 14px 40px rgba(45,212,191,.16); }
        .composer textarea {
            flex: 1; border: none; outline: none; resize: none; font-family: inherit;
            font-size: 14px; color: var(--text); background: transparent;
            max-height: 150px; line-height: 1.6; padding: 6px 0;
        }
        .composer textarea::placeholder { color: var(--text-muted); }
        .send-btn {
            width: 44px; height: 44px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff; font-size: 15px; cursor: pointer; flex-shrink: 0;
            display: grid; place-items: center;
            transition: transform .2s, box-shadow .2s, opacity .2s;
            box-shadow: 0 6px 14px rgba(45,212,191,.35);
        }
        .send-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 20px rgba(45,212,191,.42); }
        .send-btn:active:not(:disabled) { transform: scale(.95); }
        .send-btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
        .stop-btn { background: linear-gradient(135deg, #EF4444, #F97316); box-shadow: 0 6px 14px rgba(239,68,68,.35); }
        .stop-btn:hover:not(:disabled) { box-shadow: 0 10px 20px rgba(239,68,68,.42); }
        .err-banner {
            display: flex; align-items: center; gap: 8px;
            background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.35);
            color: #DC2626; padding: 8px 12px; border-radius: 10px;
            font-size: 13px; margin-top: 4px;
        }
        .err-banner.warn { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.35); color: #B45309; }
        .composer-hint { max-width: 780px; margin: 8px auto 0; font-size: 10.5px; color: var(--text-muted); text-align: center; }

        /* 法条弹窗 */
        .modal-mask {
            position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index: 60;
            display: none; align-items: center; justify-content: center; padding: 20px;
            backdrop-filter: blur(3px);
        }
        .modal-mask.show { display: flex; }
        .modal {
            width: 100%; max-width: 400px; background: #fff; border-radius: 18px;
            padding: 22px; box-shadow: var(--shadow-lg); animation: pop .3s cubic-bezier(.16,1,.3,1);
        }
        .modal h3 { font-size: 15px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .modal h3 i { color: var(--accent); }
        .modal p { font-size: 13px; color: var(--text-2); line-height: 1.7; }
        .modal .law-tag { color: var(--accent); font-weight: 600; }
        .law-text {
            margin: 14px 0 18px; padding: 14px 16px; border-radius: 12px;
            background: var(--surface-soft); border: 1px solid var(--border);
            max-height: 300px; overflow-y: auto; font-size: 13.5px; color: var(--text); line-height: 1.8;
        }
        .law-text .law-loading, .law-text .law-missing { text-align: center; color: var(--text-muted); margin: 8px 0; }
        .law-text .law-missing i { color: var(--danger); margin-right: 4px; }
        .law-text .law-body { margin: 0; }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions button {
            flex: 1; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 600;
            cursor: pointer; border: none; transition: all .2s;
        }
        .btn-copy { background: var(--surface-soft); color: var(--text-2); }
        .btn-copy:hover { background: #E2E8F0; }
        .btn-close { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; }
        .btn-close:hover { box-shadow: 0 8px 18px rgba(45,212,191,.4); }

        /* Toast */
        .toast {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: #111827; color: #fff; padding: 10px 18px; border-radius: 12px;
            font-size: 13px; z-index: 80; opacity: 0; pointer-events: none;
            transition: all .3s; box-shadow: 0 10px 30px rgba(0,0,0,.2);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ============ 响应式 ============ */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed; left: 0; top: 0; bottom: 0; z-index: 40;
                transform: translateX(-100%);
                box-shadow: 0 0 40px rgba(0,0,0,.15);
            }
            .sidebar.open { transform: translateX(0); }
            .menu-btn { display: grid; place-items: center; }
            .disclaimer span.txt { display: none; }
            .msg { max-width: 96%; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- ======== 侧边栏 ======== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-head">
                <div class="brand">
                    <div class="brand-logo"><i class="fas fa-scale-balanced"></i></div>
                    <div>
                        <h1>法律智能问答助手</h1>
                        <p>民法典 · 劳动法 · 公司法 · 刑法 等</p>
                    </div>
                </div>
            </div>

            <button class="new-session-btn" id="newSessionBtn">
                <i class="fas fa-plus"></i> 开启新会话
            </button>

            <div class="session-label">会话记录</div>
            <div class="session-list" id="sessionList"></div>

            <div class="sidebar-foot">
                <i class="fas fa-circle-info" style="color:var(--accent)"></i>
                本系统提供法律信息参考，不构成法律意见，请咨询执业律师。
            </div>
        </aside>

        <!-- ======== 主区域 ======== -->
        <div class="main">
            <div class="topbar">
                <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
                <div class="topbar-status"><span class="status-dot"></span>在线 · 可随时咨询</div>
                <div class="disclaimer"><i class="fas fa-shield-halved"></i><span class="txt">信息仅供参考，不构成法律意见</span></div>
            </div>

            <div class="chat-wrap" id="chatWrap">
                <div class="chat-inner" id="chatInner">
                    <!-- 消息流动态注入 -->
                </div>
            </div>

            <div class="composer">
                <!-- AI-Native 模式开关 -->
                <div class="mode-selector" style="max-width: 780px; margin: 0 auto 10px; display: flex; align-items: center; gap: 12px; padding: 0 4px;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--text-2); user-select: none;">
                        <input type="checkbox" id="agentModeToggle" style="width: 16px; height: 16px; cursor: pointer; accent-color: var(--primary);">
                        <span style="font-weight: 500;">
                            <i class="fas fa-robot" style="color: var(--primary); margin-right: 4px;"></i>
                            AI智能体模式
                        </span>
                    </label>
                    <span id="agentModeHint" style="font-size: 11px; color: var(--text-muted); display: none;">
                        (AI会主动追问、调用工具、生成文书)
                    </span>
                    <span id="agentStatusBadge" style="margin-left: auto; font-size: 11px; padding: 4px 10px; border-radius: 999px; background: var(--surface-soft); color: var(--text-muted); display: none;">
                        检查中...
                    </span>
                </div>
                
                <div class="composer-inner">
                    <textarea id="chatInput" rows="1" placeholder="输入您的法律问题，例如：公司拖欠工资如何维权？"></textarea>
                    <button class="send-btn stop-btn" id="stopBtn" title="停止生成" style="display:none"><i class="fas fa-stop"></i></button>
                    <button class="send-btn" id="sendBtn" title="发送"><i class="fas fa-paper-plane"></i></button>
                </div>
                <div class="composer-hint">Enter 发送 · Shift+Enter 换行 · 本助手支持民法典 / 劳动法 / 公司法 / 刑法 / 民事诉讼法 等</div>
            </div>
        </div>
    </div>

    <!-- 法条弹窗 -->
    <div class="modal-mask" id="lawModal">
        <div class="modal">
            <h3><i class="fas fa-scale-balanced"></i> <span class="law-tag" id="lawCite"></span> 法条原文</h3>
            <div class="law-text" id="lawText">
                <p class="law-loading"><i class="fas fa-spinner fa-spin"></i> 正在加载法条原文…</p>
            </div>
            <div class="modal-actions">
                <button class="btn-copy" id="copyLawBtn"><i class="fas fa-copy"></i> 复制引用</button>
                <button class="btn-close" id="closeLawBtn"><i class="fas fa-xmark"></i> 关闭</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        /* ================= 状态 ================= */
        let currentSessionId = null;
        let isStreaming = false;
        let streamAbort = false;      // 用户主动停止生成标志
        let socket = null;
        let sessions = [];            // 本地会话记录 [{id, title, count}]
        let isAgentMode = false;      // AI-Native 智能体模式开关
        let agentAvailable = false;   // 智能体系统是否可用
        const API = '';               // 同域部署留空

        const chatInner = document.getElementById('chatInner');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const sessionList = document.getElementById('sessionList');
        const sidebar = document.getElementById('sidebar');
        const lawModal = document.getElementById('lawModal');
        let activeLaw = { law: '', art: '' };

        /* ================= 工具 ================= */
        function scrollToBottom() {
            const wrap = document.getElementById('chatWrap');
            requestAnimationFrame(() => { wrap.scrollTop = wrap.scrollHeight; });
        }
        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2200);
        }
        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        /* 匹配法条引用：《xx法》第N条 */
        const LAW_REG = /《([^《》]{1,10}?)》(第[一二三四五六七八九十百千万0-9１-９]+条)/g;
        function highlightLawRefs(html) {
            // 用占位避免命中已转义/标签内的内容；简单起见直接替换文本中出现的引用
            return html.replace(LAW_REG, function(m, law, art) {
                const safe = escapeHtml(m);
                return `<span class="law-ref" data-law="${escapeHtml(law)}" data-art="${escapeHtml(art)}">${safe}</span>`;
            });
        }
        function renderMarkdown(text) {
            if (window.marked) {
                try { return marked.parse(text || ''); } catch (e) { return escapeHtml(text); }
            }
            return escapeHtml(text).replace(/\n/g, '<br>');
        }

        /* ================= 会话管理 ================= */
        async function createSession() {
            const res = await fetch(`${API}/api/create_session`, { method: 'POST' });
            if (!res.ok) throw new Error('创建会话失败');
            const data = await res.json();
            currentSessionId = data.session_id;
            sessions.unshift({ id: data.session_id, title: '新会话', count: 0 });
            renderSessions();
            showWelcome();
        }
        function renderSessions() {
            sessionList.innerHTML = '';
            sessions.forEach(s => {
                const item = document.createElement('div');
                item.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
                item.innerHTML = `
                    <span class="dot"></span>
                    <div class="txt">
                        <div class="q">${escapeHtml(s.title)}</div>
                        <div class="meta">${s.count} 轮对话</div>
                    </div>
                    <button class="del" title="删除会话"><i class="fas fa-trash"></i></button>
                `;
                item.querySelector('.txt').addEventListener('click', () => switchSession(s.id));
                item.querySelector('.del').addEventListener('click', (e) => { e.stopPropagation(); deleteSession(s.id); });
                sessionList.appendChild(item);
            });
        }
        async function switchSession(id) {
            if (id === currentSessionId) return;
            currentSessionId = id;
            renderSessions();
            chatInner.innerHTML = '';
            try {
                const res = await fetch(`${API}/api/history/${id}`);
                if (res.ok) {
                    const data = await res.json();
                    if (!data.history || data.history.length === 0) { showWelcome(); return; }
                    data.history.forEach((h, i) => {
                        addMessage('user', h.question, false);
                        addMessage('assistant', h.answer, false, true);
                    });
                    const s = sessions.find(x => x.id === id);
                    if (s) { s.title = data.history[data.history.length - 1].question.slice(0, 18); s.count = data.history.length; renderSessions(); }
                }
            } catch (e) { console.error(e); }
            scrollToBottom();
        }
        async function deleteSession(id) {
            sessions = sessions.filter(s => s.id !== id);
            renderSessions();
            if (id === currentSessionId) {
                try { await fetch(`${API}/api/history/${id}`, { method: 'DELETE' }); } catch (e) {}
                createSession();
            }
        }
        async function loadSources() {
            try {
                const res = await fetch(`${API}/api/sources`);
                if (res.ok) { const d = await res.json(); console.log('可用法律领域:', d.sources); }
            } catch (e) {}
        }

        /* ================= 欢迎卡片 ================= */
        const SUGGESTS = ['公司拖欠工资如何维权', '劳动合同到期没续签怎么办', '正当防卫如何认定', '买到过期食品能索赔吗'];
        function showWelcome() {
            chatInner.innerHTML = `
                <div class="welcome anim-rise">
                    <div class="big"><i class="fas fa-scale-balanced"></i></div>
                    <h2>您好，我是法律智能问答助手</h2>
                    <p>基于民法典、劳动法、公司法、刑法等常用法律，为您提供信息参考。可以直接提问，或试试下面的示例：</p>
                    <div class="suggest">
                        ${SUGGESTS.map(s => `<button data-q="${escapeHtml(s)}">${escapeHtml(s)}</button>`).join('')}
                    </div>
                </div>
            `;
            chatInner.querySelectorAll('.suggest button').forEach(b => {
                b.addEventListener('click', () => sendMessage(b.dataset.q));
            });
        }

        /* ================= 消息渲染 ================= */
        function addMessage(type, content, animate = true, skipMeta = false) {
            const el = document.createElement('div');
            el.className = 'msg ' + type;
            el.innerHTML = `
                <div class="avatar"><i class="fas ${type === 'user' ? 'fa-user' : 'fa-scale-balanced'}"></i></div>
                <div>
                    <div class="bubble">${renderMarkdown(content)}</div>
                    ${skipMeta ? '' : '<div class="msg-meta"></div>'}
                </div>
            `;
            // 高亮法条
            const bubble = el.querySelector('.bubble');
            bubble.innerHTML = highlightLawRefs(bubble.innerHTML);
            bindLawRefs(el);
            if (animate) el.classList.add('anim-pop');
            chatInner.appendChild(el);
            scrollToBottom();
            return el;
        }

        function bindLawRefs(container) {
            container.querySelectorAll('.law-ref').forEach(span => {
                span.addEventListener('click', () => {
                    activeLaw = { law: span.dataset.law, art: span.dataset.art };
                    openLawModal();
                });
            });
        }

        async function openLawModal() {
            document.getElementById('lawCite').textContent = `《${activeLaw.law}》${activeLaw.art}`;
            const textBox = document.getElementById('lawText');
            textBox.innerHTML = '<p class="law-loading"><i class="fas fa-spinner fa-spin"></i> 正在加载法条原文…</p>';
            lawModal.classList.add('show');
            try {
                const url = `${API}/api/law?law=${encodeURIComponent(activeLaw.law)}&article=${encodeURIComponent(activeLaw.art)}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error('未找到');
                const data = await res.json();
                textBox.innerHTML = '<p class="law-body">' + highlightLawRefs(renderMarkdown(data.text)) + '</p>';
                bindLawRefs(textBox);
            } catch (e) {
                textBox.innerHTML = '<p class="law-missing"><i class="fas fa-circle-exclamation"></i> 未检索到该条原文，可尝试提问获取。</p>';
            }
        }

        function appendTypingCaret(bubble) {
            const caret = document.createElement('span');
            caret.className = 'typing-caret';
            bubble.appendChild(caret);
            return caret;
        }

        /* ================= 发送 & 流式 ================= */
        function sendMessage(rawText) {
            const query = (rawText != null ? rawText : chatInput.value).trim();
            if (!query || isStreaming) return;

            chatInput.value = '';
            chatInput.style.height = 'auto';

            // 记录到会话
            const s = sessions.find(x => x.id === currentSessionId);
            if (s) { if (s.count === 0) { s.title = query.slice(0, 18); } s.count++; renderSessions(); }

            addMessage('user', query);

            // 临时助手气泡（用于流式填充）
            const tempEl = document.createElement('div');
            tempEl.className = 'msg assistant';
            tempEl.innerHTML = `
                <div class="avatar"><i class="fas fa-scale-balanced"></i></div>
                <div>
                    <div class="bubble typing-dots"><span></span><span></span><span></span></div>
                    <div class="msg-meta"></div>
                </div>
            `;
            chatInner.appendChild(tempEl);
            scrollToBottom();

            streamAbort = false;
            setStreamingUI(true);

            // 根据模式选择不同的接口
            const endpoint = isAgentMode ? `${API}/api/agent/query` : `${API}/api/query`;
            const requestBody = isAgentMode 
                ? { query, session_id: currentSessionId, use_agent: true }
                : { query, source_filter: '', session_id: currentSessionId };

            fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            }).then(r => r.json()).then(data => {
                const bubble = tempEl.querySelector('.bubble');
                const meta = tempEl.querySelector('.msg-meta');

                // AI-Native 模式的响应处理
                if (isAgentMode && data.mode === 'agent') {
                    bubble.classList.remove('typing-dots');
                    bubble.innerHTML = highlightLawRefs(renderMarkdown(data.answer));
                    bindLawRefs(tempEl);
                    
                    // 显示工具调用信息
                    let metaHtml = `<span class="src-badge" style="background: linear-gradient(135deg, var(--primary), var(--accent)); color: white;">
                                     <i class="fas fa-robot"></i> AI智能体模式</span>`;
                    
                    if (data.tools_called && data.tools_called.length > 0) {
                        metaHtml += `<span title="调用了${data.tools_called.length}个工具">
                                     <i class="fas fa-wrench"></i> ${data.tools_called.length}个工具</span>`;
                    }
                    
                    metaHtml += `<span>${(data.processing_time || 0).toFixed(1)}s</span>`;
                    meta.innerHTML = metaHtml;
                    scrollToBottom();
                    return;
                }

                // 传统模式的响应处理
                if (data.is_streaming) {
                    return streamOverWebSocket(query, tempEl, bubble, meta, data.session_id);
                }
                // BM25 精确命中：直接渲染
                bubble.classList.remove('typing-dots');
                bubble.innerHTML = highlightLawRefs(renderMarkdown(data.answer));
                bindLawRefs(tempEl);
                meta.innerHTML = `<span class="src-badge"><i class="fas fa-book-open"></i> 法条数据库命中</span>
                                  <span>${(data.processing_time || 0).toFixed(1)}s</span>`;
                scrollToBottom();
            }).catch(err => {
                showError(tempEl.querySelector('.bubble'), `请求失败：${err.message || '请重试'}`);
            }).finally(() => {
                setStreamingUI(false);
            });
        }

        const stopBtn = document.getElementById('stopBtn');

        function setStreamingUI(v) {
            isStreaming = v;
            sendBtn.disabled = v;
            sendBtn.style.pointerEvents = v ? 'none' : '';
            stopBtn.style.display = v ? 'grid' : 'none';
        }

        function showError(bubble, msg) {
            bubble.classList.remove('typing-dots');
            const caret = bubble.querySelector('.typing-caret');
            if (caret) caret.remove();
            bubble.innerHTML = `<div class="err-banner"><i class="fas fa-circle-exclamation"></i> ${escapeHtml(msg)}</div>`;
            toast(msg);
        }

        function streamOverWebSocket(query, tempEl, bubble, meta) {
            return new Promise((resolve, reject) => {
                const MAX_ATTEMPTS = 3;
                let attempt = 0;
                let completed = false;

                function connect() {
                    attempt++;
                    if (socket && socket.readyState === WebSocket.OPEN) socket.close();
                    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
                    socket = new WebSocket(`${proto}//${location.host}${API}/api/stream`);

                    let acc = '';
                    bubble.classList.remove('typing-dots');
                    bubble.innerHTML = '';
                    appendTypingCaret(bubble);

                    socket.onopen = () => socket.send(JSON.stringify({ query, source_filter: '', session_id: currentSessionId }));
                    socket.onmessage = (ev) => {
                        let data; try { data = JSON.parse(ev.data); } catch (e) { return; }
                        if (data.type === 'start') {
                            if (!bubble.querySelector('.typing-caret')) appendTypingCaret(bubble);
                        } else if (data.type === 'token') {
                            acc += data.token;
                            const caret = bubble.querySelector('.typing-caret');
                            bubble.innerHTML = highlightLawRefs(renderMarkdown(acc));
                            bindLawRefs(tempEl);
                            if (caret) bubble.appendChild(caret);
                            scrollToBottom();
                        } else if (data.type === 'end') {
                            completed = true;
                            const caret = bubble.querySelector('.typing-caret');
                            if (caret) caret.remove();
                            meta.innerHTML = `<span class="src-badge"><i class="fas fa-book-open"></i> 检索 + AI 生成</span>
                                              <span>${(data.processing_time || 0).toFixed(1)}s</span>`;
                            try { socket.close(); } catch (e) {}
                            resolve();
                        } else if (data.type === 'error') {
                            completed = true;
                            showError(bubble, data.error || '生成出错，请重试');
                            try { socket.close(); } catch (e) {}
                            reject(new Error(data.error));
                        }
                    };
                    socket.onerror = () => { /* 交给 onclose 统一处理重连 */ };
                    socket.onclose = () => {
                        if (completed) return;                       // 正常结束
                        if (streamAbort) {                           // 用户主动停止
                            const caret = bubble.querySelector('.typing-caret');
                            if (caret) caret.remove();
                            bubble.insertAdjacentHTML('beforeend',
                                '<div class="err-banner warn"><i class="fas fa-hand"></i> 已停止生成，以上为已输出的内容</div>');
                            resolve();
                            return;
                        }
                        if (attempt < MAX_ATTEMPTS) {                // 断线自动重连
                            toast(`连接中断，正在重连…（第 ${attempt + 1} 次）`);
                            setTimeout(connect, 700);
                        } else {
                            showError(bubble, '连接中断，多次重连失败，请重试');
                            reject(new Error('connection lost'));
                        }
                    };
                }
                connect();
            });
        }

        /* ================= 弹窗 & 交互 ================= */
        document.getElementById('copyLawBtn').addEventListener('click', () => {
            const txt = `《${activeLaw.law}》${activeLaw.art}`;
            navigator.clipboard && navigator.clipboard.writeText(txt).then(() => toast(`已复制 ${txt}`));
        });
        document.getElementById('closeLawBtn').addEventListener('click', () => lawModal.classList.remove('show'));
        lawModal.addEventListener('click', (e) => { if (e.target === lawModal) lawModal.classList.remove('show'); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lawModal.classList.remove('show'); });

        document.getElementById('menuBtn').addEventListener('click', () => sidebar.classList.toggle('open'));
        document.getElementById('newSessionBtn').addEventListener('click', () => {
            createSession();
            if (window.innerWidth <= 768) sidebar.classList.remove('open');
        });

        sendBtn.addEventListener('click', () => sendMessage());
        stopBtn.addEventListener('click', () => {
            streamAbort = true;
            if (socket && socket.readyState === WebSocket.OPEN) socket.close();
            setStreamingUI(false);
        });
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
        chatInput.addEventListener('input', () => {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 150) + 'px';
        });

        /* ================= AI-Native 模式控制 ================= */
        const agentToggle = document.getElementById('agentModeToggle');
        const agentHint = document.getElementById('agentModeHint');
        const agentStatusBadge = document.getElementById('agentStatusBadge');

        // 检查 AI-Native 智能体系统状态
        async function checkAgentStatus() {
            try {
                const response = await fetch(`${API}/api/agent/status`);
                const data = await response.json();
                agentAvailable = data.available;
                
                if (agentAvailable) {
                    agentStatusBadge.textContent = '✓ 智能体系统可用';
                    agentStatusBadge.style.background = 'rgba(34, 197, 94, 0.1)';
                    agentStatusBadge.style.color = '#22c55e';
                    agentToggle.disabled = false;
                } else {
                    agentStatusBadge.textContent = '智能体系统未启动';
                    agentStatusBadge.style.background = 'rgba(239, 68, 68, 0.1)';
                    agentStatusBadge.style.color = '#ef4444';
                    agentToggle.disabled = true;
                    agentToggle.checked = false;
                }
                agentStatusBadge.style.display = 'inline-block';
                
                // 3秒后隐藏状态提示
                setTimeout(() => {
                    agentStatusBadge.style.display = 'none';
                }, 3000);
            } catch (err) {
                console.warn('检查智能体状态失败:', err);
                agentAvailable = false;
                agentToggle.disabled = true;
            }
        }

        // 模式切换事件
        agentToggle.addEventListener('change', (e) => {
            isAgentMode = e.target.checked;
            agentHint.style.display = isAgentMode ? 'inline' : 'none';
            
            if (isAgentMode) {
                toast('✓ AI智能体模式已启用 - AI会主动追问、调用工具、生成文书');
            } else {
                toast('已切换到传统模式');
            }
        });

        // 鼠标悬停显示提示
        agentToggle.parentElement.addEventListener('mouseenter', () => {
            if (agentAvailable) {
                agentHint.style.display = 'inline';
            }
        });
        agentToggle.parentElement.addEventListener('mouseleave', () => {
            if (!isAgentMode) {
                agentHint.style.display = 'none';
            }
        });

        /* ================= 初始化 ================= */
        (async function init() {
            try {
                await loadSources();
                await createSession();
                await checkAgentStatus();  // 检查智能体系统状态
            } catch (e) {
                chatInner.innerHTML = '<p style="padding:30px;text-align:center;color:#EF4444">初始化失败：' + escapeHtml(e.message) + '</p>';
            }
            chatInput.focus();
        })();
    </script>
</body>
</html>
