# ==============================================================
# 自包含 Docker 编排：MySQL + Redis + Milvus(etcd/minio) + 应用
#   一键：docker compose up -d --build
#   统一服务名：mysql / redis / milvus（与 Dockerfile 的 sed、config.ini 对齐）
#
# 注意：
#   1. 本编排使用全新命名卷，是「干净部署」。若沿用现有 Itcast 的
#      milvus_redis 数据，请继续用那套栈，勿与本编排同时运行（端口冲突）。
#   2. 首次部署需导入数据：MySQL 导入 jpkb、Milvus 执行 scripts/ingest_milvus.py。
#   3. 端口 3306/6379/19530 与本机已运行的容器冲突时，先停旧的再起本套。
# ==============================================================

services:
  # ---------- MySQL ----------
  mysql:
    image: mysql:8.0.43
    container_name: legal_qa_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-12345678}
      MYSQL_DATABASE: legal_qa
    command: --local-infile=1 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-12345678}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [legal_qa_network]

  # ---------- Redis ----------
  redis:
    image: redis:7.2
    container_name: legal_qa_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-1234}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-1234}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [legal_qa_network]

  # ---------- Milvus 依赖：etcd ----------
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: legal_qa_etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_ENABLE_V2=true
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd/data
    volumes:
      - etcd_data:/etcd/data
    networks: [legal_qa_network]

  # ---------- Milvus 依赖：minio ----------
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: legal_qa_minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio/data
    volumes:
      - minio_data:/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [legal_qa_network]

  # ---------- Milvus（standalone）----------
  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: legal_qa_milvus
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    networks: [legal_qa_network]

  # ---------- 主应用 ----------
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: legal_qa_app
    ports:
      - "8003:8003"
    volumes:
      - ./docker_logs:/app/logs
      # 本地模型 + 意图分类模型：不进镜像（.dockerignore 已排除），用卷挂载提供
      - ./rag_qa/models:/app/rag_qa/models
      - ./rag_qa/core/bert_query_classifier:/app/rag_qa/core/bert_query_classifier
    environment:
      - PYTHONUNBUFFERED=1
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-12345678}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-1234}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [legal_qa_network]
    restart: unless-stopped

networks:
  legal_qa_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
