<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal QA System - 系统流程图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 30px;
            overflow-x: auto;
        }

        .container {
            min-width: 1600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 10px;
            color: #60a5fa;
            text-shadow: 0 2px 8px rgba(96, 165, 250, 0.3);
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 18px;
        }

        .diagram-section {
            background: #1e293b;
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 40px;
            border: 1px solid #334155;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .section-title {
            font-size: 24px;
            margin-bottom: 30px;
            color: #60a5fa;
            border-bottom: 2px solid #334155;
            padding-bottom: 12px;
        }

        .legend {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 24px;
            margin-top: 30px;
            padding: 20px;
            background: #0f172a;
            border-radius: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-box {
            width: 32px;
            height: 32px;
            border-radius: 6px;
        }

        .legend-text {
            font-size: 14px;
            color: #cbd5e1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .stat-card {
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #60a5fa;
            text-align: center;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #60a5fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Legal QA System 系统流程图</h1>
        <p class="subtitle">AI-Native 法律问答系统 - 双模式架构</p>

        <!-- 1. 总体架构图 -->
        <div class="diagram-section">
            <h2 class="section-title">1. 总体系统架构</h2>
            <svg width="1520" height="900" xmlns="http://www.w3.org/2000/svg" style="display: block; margin: 0 auto;">
                <defs>
                    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
                    </linearGradient>
                    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
                    </linearGradient>
                    <linearGradient id="grad3" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
                    </linearGradient>
                </defs>

                <!-- 用户层 -->
                <rect x="610" y="40" width="300" height="80" rx="12" fill="url(#grad1)" stroke="#60a5fa" stroke-width="3"/>
                <text x="760" y="90" text-anchor="middle" fill="white" font-size="24" font-weight="bold">用户浏览器</text>

                <!-- HTTP/WebSocket -->
                <line x1="760" y1="120" x2="760" y2="190" stroke="#60a5fa" stroke-width="3" stroke-dasharray="10,5"/>
                <text x="800" y="155" fill="#94a3b8" font-size="15">HTTP/WebSocket</text>

                <!-- FastAPI层 -->
                <rect x="410" y="190" width="700" height="150" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="3"/>
                <text x="760" y="230" text-anchor="middle" fill="#60a5fa" font-size="22" font-weight="bold">FastAPI 服务层 (app.py)</text>

                <!-- 传统模式 -->
                <rect x="470" y="260" width="240" height="65" rx="10" fill="url(#grad2)" stroke="#10b981" stroke-width="2.5"/>
                <text x="590" y="290" text-anchor="middle" fill="white" font-size="18" font-weight="bold">传统模式</text>
                <text x="590" y="312" text-anchor="middle" fill="white" font-size="14">/api/query</text>

                <!-- AI-Native模式 -->
                <rect x="810" y="260" width="240" height="65" rx="10" fill="url(#grad3)" stroke="#f59e0b" stroke-width="2.5"/>
                <text x="930" y="290" text-anchor="middle" fill="white" font-size="18" font-weight="bold">AI-Native 模式</text>
                <text x="930" y="312" text-anchor="middle" fill="white" font-size="14">/api/agent/query</text>

                <!-- 连接线 -->
                <line x1="590" y1="325" x2="420" y2="390" stroke="#10b981" stroke-width="3"/>
                <line x1="930" y1="325" x2="1100" y2="390" stroke="#f59e0b" stroke-width="3"/>

                <!-- 传统模式处理层 -->
                <rect x="60" y="390" width="720" height="200" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
                <text x="420" y="425" text-anchor="middle" fill="#10b981" font-size="20" font-weight="bold">传统检索流程</text>

                <rect x="100" y="455" width="140" height="80" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
                <text x="170" y="490" text-anchor="middle" fill="#10b981" font-size="16" font-weight="bold">BM25检索</text>
                <text x="170" y="512" text-anchor="middle" fill="#94a3b8" font-size="13">精确匹配</text>

                <text x="260" y="495" fill="#94a3b8" font-size="20">→</text>

                <rect x="290" y="455" width="140" height="80" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
                <text x="360" y="490" text-anchor="middle" fill="#10b981" font-size="16" font-weight="bold">BERT分类</text>
                <text x="360" y="512" text-anchor="middle" fill="#94a3b8" font-size="13">意图识别</text>

                <text x="450" y="495" fill="#94a3b8" font-size="20">→</text>

                <rect x="480" y="455" width="140" height="80" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
                <text x="550" y="490" text-anchor="middle" fill="#10b981" font-size="16" font-weight="bold">RAG检索</text>
                <text x="550" y="512" text-anchor="middle" fill="#94a3b8" font-size="13">向量+重排</text>

                <text x="640" y="495" fill="#94a3b8" font-size="20">→</text>

                <rect x="670" y="455" width="90" height="80" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
                <text x="715" y="490" text-anchor="middle" fill="#10b981" font-size="16" font-weight="bold">LLM</text>
                <text x="715" y="512" text-anchor="middle" fill="#94a3b8" font-size="13">生成</text>

                <text x="420" y="570" text-anchor="middle" fill="#64748b" font-size="15" font-style="italic">响应时间: 1-2秒 | 单次回答</text>

                <!-- AI-Native处理层 -->
                <rect x="840" y="390" width="620" height="200" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
                <text x="1150" y="425" text-anchor="middle" fill="#f59e0b" font-size="20" font-weight="bold">AI-Native 智能体工作流 (LangGraph)</text>

                <rect x="870" y="455" width="110" height="65" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
                <text x="925" y="483" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">意图分类</text>
                <text x="925" y="503" text-anchor="middle" fill="#94a3b8" font-size="11">Classifier</text>

                <text x="1000" y="487" fill="#94a3b8" font-size="16">→</text>

                <rect x="1020" y="455" width="110" height="65" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
                <text x="1075" y="483" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">事实澄清</text>
                <text x="1075" y="503" text-anchor="middle" fill="#94a3b8" font-size="11">Clarifier</text>

                <text x="1150" y="487" fill="#94a3b8" font-size="16">→</text>

                <rect x="1170" y="455" width="110" height="65" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
                <text x="1225" y="483" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">检索器</text>
                <text x="1225" y="503" text-anchor="middle" fill="#94a3b8" font-size="11">Retriever</text>

                <text x="1300" y="487" fill="#94a3b8" font-size="16">→</text>

                <rect x="1320" y="455" width="110" height="65" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
                <text x="1375" y="483" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">工具调用</text>
                <text x="1375" y="503" text-anchor="middle" fill="#94a3b8" font-size="11">11 Tools</text>

                <rect x="1020" y="535" width="110" height="45" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
                <text x="1075" y="555" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">答案生成</text>
                <text x="1075" y="572" text-anchor="middle" fill="#94a3b8" font-size="11">Generator</text>

                <text x="1150" y="557" fill="#94a3b8" font-size="16">→</text>

                <rect x="1170" y="535" width="110" height="45" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
                <text x="1225" y="555" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">质量审查</text>
                <text x="1225" y="572" text-anchor="middle" fill="#94a3b8" font-size="11">Critic</text>

                <text x="1150" y="570" text-anchor="middle" fill="#64748b" font-size="15" font-style="italic">3-5秒 | 多步推理</text>

                <!-- 数据层 -->
                <rect x="360" y="640" width="800" height="210" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="3"/>
                <text x="760" y="680" text-anchor="middle" fill="#60a5fa" font-size="22" font-weight="bold">数据存储层</text>

                <rect x="410" y="710" width="180" height="120" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="2.5"/>
                <text x="500" y="745" text-anchor="middle" fill="#3b82f6" font-size="18" font-weight="bold">MySQL</text>
                <text x="500" y="775" text-anchor="middle" fill="#94a3b8" font-size="14">• 法条数据</text>
                <text x="500" y="800" text-anchor="middle" fill="#94a3b8" font-size="14">• 对话历史</text>
                <text x="500" y="820" text-anchor="middle" fill="#94a3b8" font-size="13">2,632条</text>

                <rect x="670" y="710" width="180" height="120" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="2.5"/>
                <text x="760" y="745" text-anchor="middle" fill="#8b5cf6" font-size="18" font-weight="bold">Milvus</text>
                <text x="760" y="775" text-anchor="middle" fill="#94a3b8" font-size="14">• Dense向量</text>
                <text x="760" y="800" text-anchor="middle" fill="#94a3b8" font-size="14">• Sparse向量</text>
                <text x="760" y="820" text-anchor="middle" fill="#94a3b8" font-size="13">17字段元数据</text>

                <rect x="930" y="710" width="180" height="120" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="2.5"/>
                <text x="1020" y="745" text-anchor="middle" fill="#ef4444" font-size="18" font-weight="bold">Redis</text>
                <text x="1020" y="775" text-anchor="middle" fill="#94a3b8" font-size="14">• BM25缓存</text>
                <text x="1020" y="800" text-anchor="middle" fill="#94a3b8" font-size="14">• Agent状态</text>
                <text x="1020" y="820" text-anchor="middle" fill="#94a3b8" font-size="13">30分钟TTL</text>

                <!-- 连接线到数据层 -->
                <line x1="420" y1="590" x2="500" y2="710" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
                <line x1="550" y1="590" x2="760" y2="710" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
                <line x1="1150" y1="590" x2="760" y2="710" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
                <line x1="1150" y1="590" x2="1020" y2="710" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
            </svg>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-box" style="background: linear-gradient(180deg, #3b82f6 0%, #1e40af 100%);"></div>
                    <span class="legend-text">用户界面层</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box" style="background: linear-gradient(180deg, #10b981 0%, #059669 100%);"></div>
                    <span class="legend-text">传统模式 (BM25+RAG)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box" style="background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);"></div>
                    <span class="legend-text">AI-Native 智能体</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box" style="background: #3b82f6;"></div>
                    <span class="legend-text">MySQL 数据库</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box" style="background: #8b5cf6;"></div>
                    <span class="legend-text">Milvus 向量库</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box" style="background: #ef4444;"></div>
                    <span class="legend-text">Redis 缓存</span>
                </div>
            </div>
        </div>

        <!-- 2. 传统模式详细流程 -->
        <div class="diagram-section">
            <h2 class="section-title">2. 传统模式查询流程 (BM25 + RAG)</h2>
            <svg width="1520" height="820" xmlns="http://www.w3.org/2000/svg" style="display: block; margin: 0 auto;">
                <!-- 开始 -->
                <circle cx="140" cy="70" r="40" fill="#10b981" stroke="#059669" stroke-width="3"/>
                <text x="140" y="80" text-anchor="middle" fill="white" font-size="18" font-weight="bold">开始</text>

                <!-- 接收查询 -->
                <line x1="140" y1="110" x2="140" y2="180" stroke="#10b981" stroke-width="3"/>
                <rect x="60" y="180" width="160" height="75" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2.5"/>
                <text x="140" y="212" text-anchor="middle" fill="#10b981" font-size="16" font-weight="bold">接收用户查询</text>
                <text x="140" y="235" text-anchor="middle" fill="#94a3b8" font-size="14">POST /api/query</text>

                <!-- BM25检索 -->
                <line x1="140" y1="255" x2="140" y2="325" stroke="#10b981" stroke-width="3"/>
                <rect x="60" y="325" width="160" height="75" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2.5"/>
                <text x="140" y="357" text-anchor="middle" fill="#10b981" font-size="16" font-weight="bold">BM25精确检索</text>
                <text x="140" y="380" text-anchor="middle" fill="#94a3b8" font-size="14">threshold=12.0</text>

                <!-- 判断 -->
                <line x1="140" y1="400" x2="140" y2="470" stroke="#10b981" stroke-width="3"/>
                <polygon points="140,470 205,535 140,600 75,535" fill="#0f172a" stroke="#10b981" stroke-width="3"/>
                <text x="140" y="530" text-anchor="middle" fill="#10b981" font-size="15" font-weight="bold">BM25</text>
                <text x="140" y="550" text-anchor="middle" fill="#10b981" font-size="15" font-weight="bold">命中?</text>

                <!-- 命中分支 -->
                <line x1="205" y1="535" x2="370" y2="535" stroke="#10b981" stroke-width="3"/>
                <text x="280" y="520" fill="#10b981" font-size="15" font-weight="bold">是</text>
                <rect x="370" y="497" width="170" height="76" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2.5"/>
                <text x="455" y="530" text-anchor="middle" fill="#10b981" font-size="16" font-weight="bold">直接返回答案</text>
                <text x="455" y="553" text-anchor="middle" fill="#94a3b8" font-size="14">1-2秒</text>
                <line x1="540" y1="535" x2="680" y2="535" stroke="#10b981" stroke-width="3"/>
                <line x1="680" y1="535" x2="680" y2="730" stroke="#10b981" stroke-width="3"/>

                <!-- RAG流程 -->
                <line x1="140" y1="600" x2="140" y2="670" stroke="#10b981" stroke-width="3"/>
                <text x="165" y="640" fill="#10b981" font-size="15" font-weight="bold">否</text>

                <!-- BERT -->
                <rect x="40" y="670" width="200" height="85" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2.5"/>
                <text x="140" y="703" text-anchor="middle" fill="#10b981" font-size="16" font-weight="bold">BERT分类</text>
                <text x="140" y="725" text-anchor="middle" fill="#94a3b8" font-size="13">意图识别</text>

                <!-- BGE-M3 -->
                <line x1="240" y1="712" x2="320" y2="712" stroke="#10b981" stroke-width="3"/>
                <rect x="320" y="670" width="200" height="85" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="2.5"/>
                <text x="420" y="703" text-anchor="middle" fill="#8b5cf6" font-size="16" font-weight="bold">BGE-M3</text>
                <text x="420" y="725" text-anchor="middle" fill="#94a3b8" font-size="13">Dense+Sparse</text>

                <!-- Milvus -->
                <line x1="520" y1="712" x2="600" y2="712" stroke="#8b5cf6" stroke-width="3"/>
                <rect x="600" y="670" width="200" height="85" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="2.5"/>
                <text x="700" y="703" text-anchor="middle" fill="#8b5cf6" font-size="16" font-weight="bold">Milvus检索</text>
                <text x="700" y="725" text-anchor="middle" fill="#94a3b8" font-size="13">Top-20</text>

                <!-- Reranker -->
                <line x1="800" y1="712" x2="880" y2="712" stroke="#8b5cf6" stroke-width="3"/>
                <rect x="880" y="670" width="200" height="85" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="2.5"/>
                <text x="980" y="703" text-anchor="middle" fill="#8b5cf6" font-size="16" font-weight="bold">Reranker</text>
                <text x="980" y="725" text-anchor="middle" fill="#94a3b8" font-size="13">重排序Top-5</text>

                <!-- LLM -->
                <line x1="1080" y1="712" x2="1160" y2="712" stroke="#10b981" stroke-width="3"/>
                <rect x="1160" y="670" width="200" height="85" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2.5"/>
                <text x="1260" y="703" text-anchor="middle" fill="#10b981" font-size="16" font-weight="bold">LLM生成</text>
                <text x="1260" y="725" text-anchor="middle" fill="#94a3b8" font-size="13">WebSocket</text>

                <!-- 终点 -->
                <line x1="680" y1="730" x2="680" y2="640" stroke="#10b981" stroke-width="3"/>
                <line x1="680" y1="640" x2="1260" y2="640" stroke="#10b981" stroke-width="3"/>
                <line x1="1260" y1="640" x2="1260" y2="600" stroke="#10b981" stroke-width="3"/>
                <circle cx="1260" cy="560" r="40" fill="#10b981" stroke="#059669" stroke-width="3"/>
                <text x="1260" y="570" text-anchor="middle" fill="white" font-size="18" font-weight="bold">结束</text>

                <!-- 标注 -->
                <text x="700" y="790" text-anchor="middle" fill="#64748b" font-size="16" font-style="italic">RAG流程: BERT分类 → BGE-M3编码 → Milvus检索 → Reranker重排 → LLM生成 (2-3秒)</text>
            </svg>
        </div>

        <!-- 3. AI-Native智能体流程 -->
        <div class="diagram-section">
            <h2 class="section-title">3. AI-Native 智能体工作流 (LangGraph)</h2>
            <svg width="1520" height="1120" xmlns="http://www.w3.org/2000/svg" style="display: block; margin: 0 auto;">
                <!-- 开始 -->
                <circle cx="760" cy="70" r="40" fill="#f59e0b" stroke="#d97706" stroke-width="3"/>
                <text x="760" y="80" text-anchor="middle" fill="white" font-size="18" font-weight="bold">开始</text>

                <!-- 意图分类 -->
                <line x1="760" y1="110" x2="760" y2="180" stroke="#f59e0b" stroke-width="3"/>
                <rect x="670" y="180" width="180" height="75" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/>
                <text x="760" y="212" text-anchor="middle" fill="#f59e0b" font-size="16" font-weight="bold">1. 意图分类</text>
                <text x="760" y="235" text-anchor="middle" fill="#94a3b8" font-size="14">Classifier Node</text>

                <!-- 判断对话结束 -->
